# Runs PADEL//CLUB on the shared edge network with no published ports.
# The Caddy edge (sibling container) proxies https://padel.xtr.sh to this alias.
services:
  padel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: padel-xtr:1.0.0
    container_name: padel-xtr-app
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
    networks:
      girl_edge:
        aliases:
          - padel-app
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

networks:
  girl_edge:
    external: true
    name: girl-xtr_girl_edge
